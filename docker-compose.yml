services:
  postgres:
    image: postgres:17
    container_name: undersea-expeditions-postgres
    env_file:
      - ./.env.docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undersea_cms -d undersea_payload"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "55632:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  cms:
    build:
      context: ./apps/cms
    container_name: undersea-expeditions-cms
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.docker
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./apps/cms:/app
      - cms-node-modules:/app/node_modules

  frontend:
    build:
      context: ./apps/frontend
      args:
        NODE_VERSION: ${FRONTEND_NODE_VERSION:-22}
    container_name: undersea-expeditions-frontend
    env_file:
      - ./.env.docker
    depends_on:
      - cms
    ports:
      - "4321:4321"
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./apps/frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  postgres-data:
  cms-node-modules:
  frontend-node-modules:
